name: Publish

on:
  push:
    branches: [main]
  schedule:
    - cron: '20 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: publish-sdk-vulkan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ghcr.io/containerpak/sdk-vulkan
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Containerfile
          pull: true
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Verify SDK
        run: docker run --rm ghcr.io/containerpak/sdk-vulkan:main sh -c 'printf "#version 450\nvoid main() { gl_Position = vec4(0.0); }\n" > /tmp/smoke.vert && glslangValidator -V /tmp/smoke.vert -o /tmp/smoke.spv && spirv-val /tmp/smoke.spv && spirv-dis /tmp/smoke.spv -o /tmp/smoke.spvasm && printf "#include <vulkan/vulkan.h>\nint main(void) { return VK_API_VERSION_MAJOR(VK_API_VERSION_1_0) != 1; }\n" | gcc -x c - $(pkg-config --cflags --libs vulkan) -o /tmp/vulkan-smoke && /tmp/vulkan-smoke'
